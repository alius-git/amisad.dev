# yaml-language-server: $schema=../../../yuruna/test/schemas/test-set.schema.yml
#
# AmisAd POC end-to-end playbook: a host-side project clear, then every
# implemented scenario s001 -> s010 in order. Shaped as a Yuruna test-set
# manifest (test-set.schema.yml) so its sequences[] drive the run.
#
# Two consumption modes:
#   - Full end-to-end pass (this file, under test/): a driver runs
#     clear.project.yml on the HOST first (stop amisad* VMs + sweep orphaned
#     files, cold-start clean) and then the guest sequences below.
#   - Continuous pool testing: COPY this file (or the guest sequences only) to
#     project/test/test-sets/<name>.yml - the pool planner reads test-sets/ and
#     iterates sequences[] each cycle. The pool cycle runner has NO host-script
#     action, so drop clear.project.yml there and keep the demo warm instead
#     (the scenarios restore the "amisad-core" snapshot and re-deliver
#     slice-runtime to the edges, so they are order-independent and repeatable).
#
# Either way the guest scenarios assume the topology is built and both edges
# (amisad-edge-a/-b) are available; bootstrap with poc/build/run-tests.ps1.
# s004 and s010 need both edges; the rest use amisad-edge-a (or the single-VM
# degraded fallback).

schemaVersion: 1
name: amisad.end-to-end

requiredGuests:
  - guest.ubuntu.server.24

sequences:
  # Host-side clear FIRST (see clear.project.yml): stop every amisad* VM and
  # sweep orphaned VM files so the pass starts clean. It wraps Clear-Project.ps1
  # and runs on the host with Administrator - not a guest sequence, so a driver
  # invokes it before the sNNN sequences below (the pool cycle runner has no
  # host-script action). Because it stops the edges, this is a COLD-start pass:
  # pair it with the topology rebuild in poc/build/run-tests.ps1.
  - clear.project.yml
  - workload.guest.ubuntu.server.24.amisad-core.s001.fulfillment
  - workload.guest.ubuntu.server.24.amisad-core.s002.fitting
  - workload.guest.ubuntu.server.24.amisad-core.s003.silence
  - workload.guest.ubuntu.server.24.amisad-core.s004.failover
  - workload.guest.ubuntu.server.24.amisad-core.s005.attribution
  - workload.guest.ubuntu.server.24.amisad-core.s006.mandate
  - workload.guest.ubuntu.server.24.amisad-core.s007.inventory
  - workload.guest.ubuntu.server.24.amisad-core.s008.mediation
  - workload.guest.ubuntu.server.24.amisad-core.s009.suppression
  - workload.guest.ubuntu.server.24.amisad-core.s010.certification
