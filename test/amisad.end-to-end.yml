# yaml-language-server: $schema=../../../yuruna/test/schemas/orchestration-sequence.schema.yml
#
# Orchestration sequence: InvokeTestSequence steps run under one status.json
# cycle (one dashboard row per inner sequence). initialize-lab is a HOST action
# (lab teardown + topology build) run before the guest scenarios; s004 is the
# only scenario that needs both edges live.

name: amisad.end-to-end
description: Host-side lab teardown + topology build, then every AmisAd scenario s001 -> s010 in order.

steps:
  - action: InvokeTestSequence
    sequence: initialize-lab.yml
    description: "Host: tear down the lab, build + start the AmisAd topology"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s001.fulfillment
    description: "Scenario s001.fulfillment: Maya's auto-close happy path, full TVP"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s002.fitting
    description: "Scenario s002.fitting: manual shortlist + Thursday booking, full TVP"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s003.silence
    description: "Scenario s003.silence: consent pause/withdraw/resume, honored commitments"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s004.failover
    description: "Scenario s004.failover: fault-injection over both edges, settlement, incident case"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s005.attribution
    description: "Scenario s005.attribution: campaign-boosted match, agency+creator attribution"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s006.mandate
    description: "Scenario s006.mandate: delegated procurement under a scoped mandate"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s007.inventory
    description: "Scenario s007.inventory: enterprise integration onboarding + inventory-truth matching"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s008.mediation
    description: "Scenario s008.mediation: zero-knowledge dispute mediation"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s009.suppression
    description: "Scenario s009.suppression: aggregate insights with anonymity-threshold suppression"

  - action: InvokeTestSequence
    sequence: workload.guest.ubuntu.server.24.amisad-core.s010.certification
    description: "Scenario s010.certification: self-seeded corpus, certify + tamper-detect + audit"
