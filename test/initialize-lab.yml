# initialize-lab.yml - host-side teardown + warm-up wrapper.
#   1. Clear-Lab.ps1 - remove every lab VM + storage, sweep orphaned files.
#   2. Initialize-Lab.ps1  - build the stash, both edges, and amisad-core
# HOST action, not a guest interaction sequence.

name: initialize-lab
description: Tear down the lab, then build + start the AmisAd topology (host-side, pre-run).

host:
  # Resolved relative to this file's folder (test/). Run elevated, in order;
  # the pass stops if either script exits non-zero.
  elevated: true
  scripts:
    - Clear-Lab.ps1
    - Initialize-Lab.ps1
