# Yuruna cycle plan for the AmisAd POC.
#
# The POC's test automation is driven by poc/build/run-tests.ps1 (see
# poc/test.md): from a clean machine it builds the design topology
# (amisad-build -> stash upload; amisad-edge-a/b; amisad-core with
# k8s + services + demo users), then runs each implemented scenario in order
# against amisad-core over SSH, each one restoring the amisad-core
# snapshot as its state reset. The single-cycle runner cannot express that
# orchestration, so the entry below is the latest implemented scenario, for
# cycle monitoring only.
sequences:
  - amisad.end-to-end
