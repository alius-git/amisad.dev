# Yuruna cycle plan for the AmisAd POC.
#
# The POC's test automation is driven by poc/build/run-tests.ps1 (see
# poc/test.md): from a clean machine it builds once (amisad.build uploads the
# binaries to the stash service), then runs each implemented scenario in order,
# fully cold, each chain under its own per-scenario user (poc/usernames.md) and
# ending in its own live VM (amisad.sNNN.<word>). The single-cycle runner
# cannot express that ordering (it merges same-guest top-levels onto one VM),
# so the entry below is the primary scenario for cycle monitoring only.
sequences:
- workload.guest.ubuntu.server.24.core.amisad.s001.fulfillment
