# yaml-language-server: $schema=../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - amisad-build compile run: restore the build snapshot, build
# every release binary over SSH, and upload the tarball to the stash service
# for the amisad-core deploy to download. Runs once per test run; every
# scenario consumes the same artifact (poc/test.md).

sequenceGuid: 4233cc03-7d1f-4c8e-8a4b-3f9e58d71b33
sequenceRevision: 2

description: "AmisAd amisad-build: cargo build --release over SSH, upload binaries tarball to the stash service."
keystrokeMechanism: ssh
resource:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-build.baseline
requiresSnapshot:
  id: "amisad-build"
variables:
  username: amisad-build-admin
  hostname: amisad-build
  # Stash-service VM the binaries are dropped into (yuruna-stash-service).
  # Discovered live at run time (Get-VMIp) instead of a hard-coded literal;
  # the guest .compile.sh aborts before building if this resolves empty.
  stashHost: "${ext:stash-service.ResolveHost(yuruna-stash-service)}"

component:
  - action: loadDiskSnapshot
    id: "amisad-build"
    description: "Restore the AmisAd build snapshot"

  - action: sshWaitReady
    timeoutSeconds: 300
    description: "SSH up after the restore"

workload:
  - action: sshFetchAndExecute
    command: "STASH_HOST='${stashHost}' /usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-build.compile.sh"
    timeoutSeconds: 3600
    # Safe to re-run after a dropped SSH transport: the script wipes and
    # re-fetches the project tree before building, and the stash upload
    # overwrites, so a second pass starts from the same place the first did.
    transportRetries: 1
    description: "cargo build --release + upload binaries to the stash service"
