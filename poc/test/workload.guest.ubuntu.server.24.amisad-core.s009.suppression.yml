# yaml-language-server: $schema=../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s009.suppression (Aggregate Insight Publication and the
# Demand-Planning Loop): restore amisad-core and run the aggregate-insights
# loop entirely on vm-core.

sequenceGuid: 42abb59b-828b-47cc-bee1-4300127d9e50
sequenceRevision: 2

description: "AmisAd s009.suppression: restore amisad-core, run aggregate insight publication with anonymity-threshold suppression and identical cross-app outlook figures, assert full TVP."
keystrokeMechanism: ssh
resource:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-core.deploy
requiresSnapshot:
  id: "amisad-core"
variables:
  username: amisad-core-admin
  hostname: amisad-core

component:
  - action: loadDiskSnapshot
    id: "amisad-core"
    description: "Restore the deployed AmisAd vm-core (per-scenario state reset)"

  - action: sshWaitReady
    timeoutSeconds: 300
    description: "SSH up after the restore"

workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.s009.suppression.sh"
    timeoutSeconds: 1800
    description: "Run s009.suppression aggregate-insights loop, assert full TVP"

  - action: saveSystemDiagnostic
    id: "amisad.s009.suppression"
    description: "Capture diagnostics after the s009.suppression run"
