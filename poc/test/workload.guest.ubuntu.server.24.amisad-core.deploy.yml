# yaml-language-server: $schema=../../../../yuruna/test/schemas/sequence.schema.yml
#
# vm-core deploy tier: restore the amisad-core-k8s snapshot, deploy the ten
# services + demo users from the stash binaries, then snapshot as "amisad-core".
# Every scenario restores that snapshot - that restore IS the per-scenario reset.

sequenceGuid: 4244dd04-5c0e-4b7d-9f3a-2e8d47c60a44
sequenceRevision: 5

description: "AmisAd amisad-core: restore amisad-core-k8s, download binaries from the stash, deploy 10 services, add maya/elena/tom/priya/marcel/kai/pat/alex/sam/dana/ingrid + demo key, snapshot amisad-core."
keystrokeMechanism: ssh
resource:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-core.k8s
requiresSnapshot:
  id: "amisad-core-k8s"
variables:
  username: amisad-core-admin
  hostname: amisad-core
  # Stash-service VM the binaries are pulled from (yuruna-stash-service).
  # Discovered live at run time (Get-VMIp) instead of a hard-coded literal;
  # the guest .deploy.sh keeps a degraded-mode default if this resolves empty.
  stashHost: "${ext:stash-service.ResolveHost(yuruna-stash-service)}"

component:
  - action: loadDiskSnapshot
    id: "amisad-core-k8s"
    description: "Restore the vm-core infrastructure tier"

  - action: sshWaitReady
    timeoutSeconds: 300
    description: "SSH up after the restore"

workload:
  - action: sshFetchAndExecute
    command: "STASH_HOST='${stashHost}' /usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.deploy.sh"
    timeoutSeconds: 3600
    description: "Add python3, download binaries from the stash, build images, deploy 10 services"

  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.users.sh"
    timeoutSeconds: 300
    description: "Add non-admin demo users (maya, elena, tom, priya, marcel, kai, pat, alex, sam, dana, ingrid) + install the core->edge demo SSH key"

  # Passwords via sshExec, the ssh action with sensitive masking in its
  # handler (sshFetchAndExecute ignores 'sensitive'; vault plaintext must not
  # ride an unmasked command line).
  - action: sshExec
    command: "printf 'maya:%s\\nelena:%s\\ntom:%s\\npriya:%s\\nmarcel:%s\\nkai:%s\\npat:%s\\nalex:%s\\nsam:%s\\ndana:%s\\ningrid:%s\\n' '${ext:authentication.GetPassword(maya)}' '${ext:authentication.GetPassword(elena)}' '${ext:authentication.GetPassword(tom)}' '${ext:authentication.GetPassword(priya)}' '${ext:authentication.GetPassword(marcel)}' '${ext:authentication.GetPassword(kai)}' '${ext:authentication.GetPassword(pat)}' '${ext:authentication.GetPassword(alex)}' '${ext:authentication.GetPassword(sam)}' '${ext:authentication.GetPassword(dana)}' '${ext:authentication.GetPassword(ingrid)}' | sudo chpasswd"
    timeoutSeconds: 120
    sensitive: true
    description: "Set the demo users' vault-managed passwords"

  - action: saveDiskSnapshot
    id: "amisad-core"
    description: "Snapshot the deployed AmisAd vm-core"
