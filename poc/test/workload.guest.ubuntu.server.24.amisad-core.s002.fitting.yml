# yaml-language-server: $schema=../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s002.fitting (Considered Purchase, Constraint Fidelity, and
# In-Person Booking): restore amisad-core (the per-scenario state reset -
# s001's orders are gone), then over SSH start slice-runtime on amisad-edge-a.

sequenceGuid: 4255ee05-8f3a-4c17-9d2b-6e4a7c90d155
sequenceRevision: 3

description: "AmisAd s002.fitting: restore amisad-core, run the manual shortlist + Thursday booking with slice-runtime on amisad-edge-a, assert full TVP."
keystrokeMechanism: ssh
resource:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-core.deploy
requiresSnapshot:
  id: "amisad-core"
variables:
  username: amisad-core-admin
  hostname: amisad-core

# The retry covers putting amisad-core in position -- restore, SSH, a cluster
# whose pods and NodePort rules are the live ones -- and stops there. Those steps
# are idempotent and every attempt starts from the snapshot again. The workload
# below is deliberately outside it: a scenario that passes only on a second run
# is reporting a defect, and replaying it would file the report in the bin.
component:
  - action: retry
    description: "Put amisad-core in position for s002.fitting: restore, SSH, cluster live"
    steps:
      - action: loadDiskSnapshot
        id: "amisad-core"
        description: "Restore the deployed AmisAd vm-core (per-scenario state reset)"

      - action: sshWaitReady
        timeoutSeconds: 300
        description: "SSH up after the restore"

      - action: sshFetchAndExecute
        command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.ready.sh"
        timeoutSeconds: 900
        description: "Bring the restored cluster to a known-live state (deployments restarted, every NodePort answering)"

workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.s002.fitting.sh"
    timeoutSeconds: 1800
    description: "Run s002.fitting shortlist + booking (edge on amisad-edge-a), assert full TVP"

  - action: saveSystemDiagnostic
    id: "amisad.s002.fitting"
    description: "Capture diagnostics after the s002.fitting run"
