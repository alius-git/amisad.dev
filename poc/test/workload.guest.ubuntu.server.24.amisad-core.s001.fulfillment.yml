# yaml-language-server: $schema=../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s001.fulfillment (Intent-Driven Edge Match and Automated
# Fulfillment): restore amisad-core - that restore IS the per-scenario state
# reset - then over SSH start slice-runtime on amisad-edge-a.

sequenceGuid: 4222bb02-7d1f-4c8e-8a4b-3f9e58d71b22
sequenceRevision: 5

description: "AmisAd s001.fulfillment: restore amisad-core, run Maya's auto-close happy path with slice-runtime on amisad-edge-a, assert full TVP."
keystrokeMechanism: ssh
resource:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-core.deploy
requiresSnapshot:
  id: "amisad-core"
variables:
  username: amisad-core-admin
  hostname: amisad-core

# The retry covers putting amisad-core in position -- restore, SSH, a cluster
# whose pods and NodePort rules are the live ones -- and stops there. Those steps
# are idempotent and every attempt starts from the snapshot again. The workload
# below is deliberately outside it: a scenario that passes only on a second run
# is reporting a defect, and replaying it would file the report in the bin.
component:
  - action: retry
    description: "Put amisad-core in position for s001.fulfillment: restore, SSH, cluster live"
    steps:
      - action: loadDiskSnapshot
        id: "amisad-core"
        description: "Restore the deployed AmisAd vm-core (per-scenario state reset)"

      - action: sshWaitReady
        timeoutSeconds: 300
        description: "SSH up after the restore"

      - action: sshFetchAndExecute
        command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.ready.sh"
        timeoutSeconds: 900
        description: "Bring the restored cluster to a known-live state (deployments restarted, every NodePort answering)"

workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.s001.fulfillment.sh"
    timeoutSeconds: 1800
    description: "Run s001.fulfillment happy path (edge on amisad-edge-a), assert full TVP"

  - action: saveSystemDiagnostic
    id: "amisad.s001.fulfillment"
    description: "Capture diagnostics after the s001.fulfillment run"
