# yaml-language-server: $schema=../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s008.mediation (Zero-Knowledge Dispute Mediation and Settlement
# Adjustment): restore amisad-core, start slice-runtime on amisad-edge-a, seed
# a settled order, open a support case carrying operational metadata only (no
# buyer identity).

sequenceGuid: 42a95e9f-3748-47f8-b8ad-cc9564d81776
sequenceRevision: 3

description: "AmisAd s008.mediation: restore amisad-core, run zero-knowledge dispute mediation (metadata-only case, scoped time-boxed disclosure, compensating settlement entries), assert full TVP."
keystrokeMechanism: ssh
resource:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-core.deploy
requiresSnapshot:
  id: "amisad-core"
variables:
  username: amisad-core-admin
  hostname: amisad-core

# The retry covers putting amisad-core in position -- restore, SSH, a cluster
# whose pods and NodePort rules are the live ones -- and stops there. Those steps
# are idempotent and every attempt starts from the snapshot again. The workload
# below is deliberately outside it: a scenario that passes only on a second run
# is reporting a defect, and replaying it would file the report in the bin.
component:
  - action: retry
    description: "Put amisad-core in position for s008.mediation: restore, SSH, cluster live"
    steps:
      - action: loadDiskSnapshot
        id: "amisad-core"
        description: "Restore the deployed AmisAd vm-core (per-scenario state reset)"

      - action: sshWaitReady
        timeoutSeconds: 300
        description: "SSH up after the restore"

      - action: sshFetchAndExecute
        command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.ready.sh"
        timeoutSeconds: 900
        description: "Bring the restored cluster to a known-live state (deployments restarted, every NodePort answering)"

workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.s008.mediation.sh"
    timeoutSeconds: 1800
    description: "Run s008.mediation dispute flow (edge on amisad-edge-a), assert full TVP"

  - action: saveSystemDiagnostic
    id: "amisad.s008.mediation"
    description: "Capture diagnostics after the s008.mediation run"
