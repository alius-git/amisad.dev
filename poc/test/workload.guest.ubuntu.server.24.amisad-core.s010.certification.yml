# yaml-language-server: $schema=../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s010.certification (Independent Certification of the Full
# Evidence Trail): restore amisad-core, start slice-runtime on amisad-edge-a
# (region identity for residency), and self-seed a representative corpus
# exercising all four audit dimensions.

sequenceGuid: 429faede-b8b2-447e-97dd-882a44e9b8d4
sequenceRevision: 3

description: "AmisAd s010.certification: restore amisad-core, self-seed a four-dimension evidence corpus, independently certify it, detect a tamper, and prove read-only audit access."
keystrokeMechanism: ssh
resource:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-core.deploy
requiresSnapshot:
  id: "amisad-core"
variables:
  username: amisad-core-admin
  hostname: amisad-core

# The retry covers putting amisad-core in position -- restore, SSH, a cluster
# whose pods and NodePort rules are the live ones -- and stops there. Those steps
# are idempotent and every attempt starts from the snapshot again. The workload
# below is deliberately outside it: a scenario that passes only on a second run
# is reporting a defect, and replaying it would file the report in the bin.
component:
  - action: retry
    description: "Put amisad-core in position for s010.certification: restore, SSH, cluster live"
    steps:
      - action: loadDiskSnapshot
        id: "amisad-core"
        description: "Restore the deployed AmisAd vm-core (per-scenario state reset)"

      - action: sshWaitReady
        timeoutSeconds: 300
        description: "SSH up after the restore"

      - action: sshFetchAndExecute
        command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.ready.sh"
        timeoutSeconds: 900
        description: "Bring the restored cluster to a known-live state (deployments restarted, every NodePort answering)"

workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.s010.certification.sh"
    timeoutSeconds: 1800
    description: "Run s010.certification over a self-seeded corpus (edge on amisad-edge-a), assert full TVP"

  - action: saveSystemDiagnostic
    id: "amisad.s010.certification"
    description: "Capture diagnostics after the s010.certification run"
