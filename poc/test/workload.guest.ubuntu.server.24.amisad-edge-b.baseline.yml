#
# AmisAd POC - vm-edge-b (region B slice VM): identical preparation to
# vm-edge-a under its own hostname/admin. Only s004.failover uses it - a
# jurisdiction-restricted allocation needs a second region to exclude - but
# the lab driver brings both edges up together.

sequenceGuid: 4277aa07-3c5d-4e69-9f2b-0d4c6e81f377
sequenceRevision: 1

description: "Ubuntu Server: provision amisad-edge-b (admin amisad-edge-b-admin), install the IP reporter over SSH, snapshot amisad-edge-b."
keystrokeMechanism: ssh
# --- REGION: resource
resource:
  ubuntu.server.24:
    - start.guest.ubuntu.server.24
variables:
  username: amisad-edge-b-admin
  hostname: amisad-edge-b

# --- REGION: component
component:
  - action: sshWaitReady
    timeoutSeconds: 300
    description: "SSH up after the start.guest reboot"

# --- REGION: workload
workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-edge.setup.sh"
    timeoutSeconds: 600
    description: "Edge setup: boot-time IP reporter"

  - action: saveDiskSnapshot
    id: "amisad-edge-b"
    description: "Snapshot the region-B slice VM"
