# yaml-language-server: $schema=../../../yuruna/test/schemas/sequence.schema.yml
# See https://yuruna.link/42010605-0007

sequenceGuid: 4266ff06-2b4c-4d58-8e1a-9c3b5d70e266
sequenceRevision: 1

description: "Ubuntu Server: provision amisad-edge-a (admin amisad-edge-a-admin), install the IP reporter over SSH, snapshot amisad-edge-a."
keystrokeMechanism: ssh
# --- REGION: resource
resource:
  ubuntu.server.24:
    - start.guest.ubuntu.server.24
variables:
  username: amisad-edge-a-admin
  hostname: amisad-edge-a

# --- REGION: component
component:
  - action: sshWaitReady
    timeoutSeconds: 300
    description: "SSH up after the start.guest reboot"

# --- REGION: workload
workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-edge.setup.sh"
    timeoutSeconds: 600
    description: "Edge setup: boot-time IP reporter"

  - action: saveDiskSnapshot
    id: "amisad-edge-a"
    description: "Snapshot the region-A slice VM"
