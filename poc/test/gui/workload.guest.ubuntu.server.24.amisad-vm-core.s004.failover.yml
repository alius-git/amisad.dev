# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s004.failover (Sovereign Slice Allocation, Isolation Fault,
# and Attested Failover) against the design topology: restore amisad-vm-core,
# then over SSH start slice-runtime on BOTH edges (region-a and region-b,
# region identity attested), configure Tom's sovereignty policy so the
# roomier region-b is excluded for the restricted jurisdiction, inject two
# consecutive isolation faults, prove the aborted environments fail SAFE
# (attested abort, no egress, no match record), the fabric retries to a clean
# completion with exactly one settlement, the incidents queue for Tom, and
# the systemic pattern escalates to Priya's cross-party platform case.
# Entirely SSH-driven. The VM stays amisad-vm-core and is left live.

# Perf-log identity. Bump revision on step add/remove.
# Rev 2: real implementation on the design topology (skeleton unparked).
sequenceGuid: 427078bc-c296-4ce8-8d7f-bfc58eaa246d
sequenceRevision: 2

description: "AmisAd s004.failover: restore amisad-vm-core, sovereign placement over two live edges, injected isolation faults with attested aborts, automatic retry, one settlement, cross-party incident case."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-vm-core.deploy
requiresSnapshot:
  id: "amisad-vm-core"
variables:
  username: amisad-vm-core-admin
  hostname: amisad-vm-core

steps:
  - action: loadDiskSnapshot
    id: "amisad-vm-core"
    description: "Restore the deployed AmisAd vm-core (per-scenario state reset)"

  - action: sshWaitReady
    timeoutSeconds: 300
    description: "SSH up after the restore"

  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-vm-core.s004.failover.sh"
    timeoutSeconds: 1800
    description: "Run s004.failover fault-injection flow (both edges), assert full TVP"

  - action: saveSystemDiagnostic
    id: "amisad.s004.failover"
    description: "Capture diagnostics after the s004.failover run"
