# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - "vm-core" runtime baseline: restore the amisad.k8s infrastructure
# snapshot, add python3, download the prebuilt binaries from the stash service
# (uploaded by amisad.build), build thin images and deploy the ten services,
# then snapshot as "amisad.core". The vm-core scenarios (s001.fulfillment,
# s002.fitting, ...) warm-path from this deployed cluster. No Rust toolchain -
# this VM runs binaries, it does not build them.

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 4244dd04-5c0e-4b7d-9f3a-2e8d47c60a44
sequenceRevision: 1

description: "AmisAd amisad.core: restore amisad.k8s, add python3, download binaries from the stash, deploy 10 services, snapshot amisad.core."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.k8s.amisad.baseline
requiresSnapshot:
  id: "amisad.k8s"
variables:
  # In a scenario chain the top-level's per-scenario username (yamisad-sNNN)
  # cascades down and wins (see usernames.md). This value applies only when the
  # baseline is run standalone; yamisad-build is seeded keystroke-safe.
  username: yamisad-build
  # Stash-service VM the binaries are pulled from (yuruna-stash-service).
  stashHost: "192.168.7.222"

steps:
  - action: loadDiskSnapshot
    id: "amisad.k8s"
    description: "Restore the AmisAd k8s + PostgreSQL + NATS baseline checkpoint"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "STASH_HOST='${stashHost}' /usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.core.amisad.deploy.sh"
    description: "Add python3, download binaries from the stash, build images, deploy 10 services"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3600

  - action: saveDiskSnapshot
    id: "amisad.core"
    description: "Snapshot the deployed AmisAd vm-core cluster"
