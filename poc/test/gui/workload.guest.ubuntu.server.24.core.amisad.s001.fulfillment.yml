# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s001.fulfillment (Intent-Driven Edge Match and Automated
# Fulfillment): cold-build the core stack (its chain rebuilds amisad.k8s and
# amisad.core under THIS scenario's user via the username cascade), start
# slice-runtime, seed Elena's offers, drive Maya's auto-close happy path, and
# assert the FULL Target Verification Point. Ends by renaming the VM to
# amisad.s001.fulfillment and leaving it LIVE. Per-scenario users/VMs:
# poc/usernames.md; automation model: poc/test.md; edgeHost: poc/demo.md.

# Perf-log identity. Bump revision on step add/remove.
# GUID carried over from the pre-split build.amisad.s001.fulfillment for perf continuity.
# Rev 3: per-scenario user (yamisad-s001) + final save/load to amisad.s001.fulfillment.
sequenceGuid: 4222bb02-7d1f-4c8e-8a4b-3f9e58d71b22
sequenceRevision: 3

description: "AmisAd s001.fulfillment: run Maya's auto-close happy path on the deployed amisad.core cluster, assert full TVP."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.core.amisad.baseline
requiresSnapshot:
  id: "amisad.core"
variables:
  # Per-SCENARIO guest username (see usernames.md). Cascades down the whole
  # baseline chain, so the k8s/core tiers are provisioned under this user too.
  username: yamisad-s001
  edgeHost: ""

steps:
  - action: loadDiskSnapshot
    id: "amisad.core"
    description: "Restore the deployed AmisAd vm-core cluster"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "EDGE_HOST='${edgeHost}' /usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.core.amisad.s001.fulfillment.sh"
    description: "Run s001.fulfillment happy path on amisad.core, assert full TVP"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 1800

  - action: saveSystemDiagnostic
    id: "amisad.s001.fulfillment"
    description: "Capture diagnostics after the s001.fulfillment run"

  # Rename the passed VM to its per-scenario name and leave it live. The rename
  # also CONSUMES the amisad.core intermediate, so the next scenario's cold
  # chain can mint fresh amisad.k8s/amisad.core without name collisions.
  # saveDiskSnapshot stops+checkpoints+renames; loadDiskSnapshot restarts.
  - action: saveDiskSnapshot
    id: "amisad.s001.fulfillment"
    description: "Checkpoint + rename the passed VM to amisad.s001.fulfillment"

  - action: loadDiskSnapshot
    id: "amisad.s001.fulfillment"
    description: "Restart so the scenario VM is left live as amisad.s001.fulfillment"
