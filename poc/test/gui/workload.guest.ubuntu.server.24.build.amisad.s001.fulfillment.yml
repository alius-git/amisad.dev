# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - build and test s001.fulfillment (Intent-Driven Edge Match and
# Automated Fulfillment) from source, inside the build VM: build, test,
# deploy, run buyer-client's happy path, assert the FULL Target Verification
# Point. Operator setup, repo delivery (lab tarball vs production PAT clone),
# and edgeHost semantics: poc/README.md "Running scenarios under Yuruna".

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 4222bb02-7d1f-4c8e-8a4b-3f9e58d71b22
sequenceRevision: 1

description: "AmisAd s001.fulfillment: clone via PAT, bazel build + cargo test, deploy, run happy path, assert full TVP."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.build.amisad.baseline
requiresSnapshot:
  id: "amisad.build"
variables:
  # Distinct guest OS user per final VM (build chain: yamisad-build): avoids
  # the first-login password-rotation collision between VMs provisioned from
  # one image under one username - poc/README.md "Running scenarios under
  # Yuruna" has the full rationale.
  username: yamisad-s001
  edgeHost: ""

steps:
  - action: loadDiskSnapshot
    id: "amisad.build"
    description: "Restore the AmisAd build-VM baseline checkpoint"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "EDGE_HOST='${edgeHost}' /usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.build.amisad.s001.fulfillment.sh"
    description: "Build, test, deploy, run s001.fulfillment happy path, assert full TVP"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3600

  - action: saveSystemDiagnostic
    id: "amisad.s001.fulfillment"
    description: "Capture diagnostics after the s001.fulfillment run"

  # Promote the passed scenario VM into the amisad.* namespace and leave it live.
  # saveDiskSnapshot stops the VM, checkpoints it, and renames it (amisad.build ->
  # amisad.s001.fulfillment) but leaves it Off; loadDiskSnapshot then restores that
  # checkpoint and Start-VMs it, so execution ends with a running VM named
  # amisad.s001.fulfillment. Both steps are required: there is no rename-only or
  # start-only action in the framework.
  - action: saveDiskSnapshot
    id: "amisad.s001.fulfillment"
    description: "Checkpoint + rename the passed VM to amisad.s001.fulfillment"

  - action: loadDiskSnapshot
    id: "amisad.s001.fulfillment"
    description: "Restart so the scenario VM is left live as amisad.s001.fulfillment"
