# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s001.fulfillment (Intent-Driven Edge Match and Automated
# Fulfillment) against the design topology: restore amisad-vm-core (that restore
# IS the per-scenario state reset), then over SSH start slice-runtime on
# amisad-vm-edge-a (real edge; single-VM degraded mode retired), seed Elena's
# offers, drive Maya's auto-close happy path, and assert the FULL Target
# Verification Point. Entirely SSH-driven - no OCR, so concurrently running
# edge VMs cannot disturb it. The VM stays amisad-vm-core and is left live.

# Perf-log identity. Bump revision on step add/remove.
# Rev 4: design-topology model - runs on amisad-vm-core with the real edge;
# SSH-driven; per-scenario VM rename retired (snapshot restore = state reset).
sequenceGuid: 4222bb02-7d1f-4c8e-8a4b-3f9e58d71b22
sequenceRevision: 4

description: "AmisAd s001.fulfillment: restore amisad-vm-core, run Maya's auto-close happy path with slice-runtime on amisad-vm-edge-a, assert full TVP."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-vm-core.deploy
requiresSnapshot:
  id: "amisad-vm-core"
variables:
  username: amisad-vm-core-admin
  hostname: amisad-vm-core

steps:
  - action: loadDiskSnapshot
    id: "amisad-vm-core"
    description: "Restore the deployed AmisAd vm-core (per-scenario state reset)"

  - action: sshWaitReady
    timeoutSeconds: 300
    description: "SSH up after the restore"

  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-vm-core.s001.fulfillment.sh"
    timeoutSeconds: 1800
    description: "Run s001.fulfillment happy path (edge on amisad-vm-edge-a), assert full TVP"

  - action: saveSystemDiagnostic
    id: "amisad.s001.fulfillment"
    description: "Capture diagnostics after the s001.fulfillment run"
