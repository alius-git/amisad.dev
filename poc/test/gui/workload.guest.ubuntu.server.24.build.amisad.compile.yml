# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - amisad.build compile run: restore the build-tool snapshot, build
# every release binary, and upload the tarball to the stash service. amisad.core
# then downloads it and deploys. This is one of two ordered runs: the compile
# run (this) must finish before the amisad.core scenario run downloads the
# artifact. See poc/README.md "Split build and runtime VMs".

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 4233cc03-7d1f-4c8e-8a4b-3f9e58d71b33
sequenceRevision: 1

description: "AmisAd amisad.build: cargo build --release, upload binaries tarball to the stash service."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.build.amisad.baseline
requiresSnapshot:
  id: "amisad.build"
variables:
  # Per-VM guest username (see usernames.md): the build VM is yamisad-build.
  username: yamisad-build
  # Stash-service VM the binaries are dropped into (yuruna-stash-service).
  stashHost: "192.168.7.222"

steps:
  - action: loadDiskSnapshot
    id: "amisad.build"
    description: "Restore the AmisAd build-tool snapshot"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "STASH_HOST='${stashHost}' /usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.build.amisad.compile.sh"
    description: "cargo build --release + upload binaries to the stash service"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3600
