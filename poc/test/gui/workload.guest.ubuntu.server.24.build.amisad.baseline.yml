# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - "build VM" baseline: a fresh Ubuntu Server plus the build
# toolchains only (rustup + pinned stable Rust, bazelisk, git, python3),
# snapshotted as "amisad.build". This VM compiles binaries and nothing else -
# it is deliberately decoupled from amisad.k8s (no Kubernetes here), which also
# keeps its guest username (yamisad-build) on its own snapshot lineage.

# Perf-log identity. Bump revision on step add/remove.
# Rev 2: decoupled from amisad.k8s (build VM needs no Kubernetes); chains
# start.guest directly instead of restoring the k8s baseline.
sequenceGuid: 4211aa01-5c0e-4b7d-9f3a-2e8d47c60a11
sequenceRevision: 2

description: "Ubuntu Server: install Rust + bazelisk + git build tools on a fresh VM, snapshot amisad.build."
baseline:
  ubuntu.server.24:
    - start.guest.ubuntu.server.24
variables:
  # Per-VM guest username (see usernames.md): the build VM is yamisad-build.
  # Cascades down to start.guest so the whole build lineage uses one account.
  username: yamisad-build

steps:
  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad.build-tools.sh"
    description: "Install build tools (rustup, bazelisk, git, python3)"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 1800

  - action: saveDiskSnapshot
    id: "amisad.build"
    description: "Snapshot the AmisAd build-VM baseline"
