# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s002.fitting (Considered Purchase, Constraint Fidelity, and
# In-Person Booking): cold-build the core stack (its chain rebuilds amisad.k8s
# and amisad.core under THIS scenario's user via the username cascade), then
# drive Maya's MANUAL-policy dress need: shortlist honoring every constraint
# incl. the dusty-blue exclusion, zero commitments until the explicit booking,
# identity-free appointment records, exactly two notifications. Ends by
# renaming the VM to amisad.s002.fitting and leaving it LIVE. Per-scenario
# users/VMs: poc/usernames.md; automation model: poc/test.md.

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 4255ee05-8f3a-4c17-9d2b-6e4a7c90d155
sequenceRevision: 1

description: "AmisAd s002.fitting: manual dress need, constraint-faithful shortlist, one-tap Thursday booking, full TVP on the deployed amisad.core cluster."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.core.amisad.baseline
requiresSnapshot:
  id: "amisad.core"
variables:
  # Per-SCENARIO guest username (see usernames.md). Cascades down the whole
  # baseline chain, so the k8s/core tiers are provisioned under this user too.
  username: yamisad-s002

steps:
  - action: loadDiskSnapshot
    id: "amisad.core"
    description: "Restore the deployed AmisAd vm-core cluster"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.core.amisad.s002.fitting.sh"
    description: "Run s002.fitting shortlist + booking on amisad.core, assert full TVP"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 1800

  - action: saveSystemDiagnostic
    id: "amisad.s002.fitting"
    description: "Capture diagnostics after the s002.fitting run"

  # Rename the passed VM to its per-scenario name and leave it live; the
  # rename consumes the amisad.core intermediate for the next scenario.
  - action: saveDiskSnapshot
    id: "amisad.s002.fitting"
    description: "Checkpoint + rename the passed VM to amisad.s002.fitting"

  - action: loadDiskSnapshot
    id: "amisad.s002.fitting"
    description: "Restart so the scenario VM is left live as amisad.s002.fitting"
