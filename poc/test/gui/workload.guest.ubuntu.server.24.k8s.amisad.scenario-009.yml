# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - SCENARIO-009: Aggregate Insight Publication and the Demand-Planning Loop
# Skeleton sequence: restores the k8s.amisad snapshot, deploys the service
# skeletons, and verifies /health for the services this scenario traverses.
# See plan/scenarios.md for the full scenario and its Target Verification Point.
#
# TODO(SCENARIO-009) real steps to implement:
#   - Seed region A above and region B below the anonymity threshold
#   - Environments emit aggregates only; the gate suppresses region B
#   - Dana publishes a versioned outlook into seller and ads views
#   - Elena stocks and Marcel scopes a campaign on identical figures
#   - Unmet-demand flag carries category and region only
#   - Assert: no below-threshold figure anywhere downstream

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 42abb59b-828b-47cc-bee1-4300127d9e50
sequenceRevision: 1

description: "AmisAd SCENARIO-009 skeleton: deploy POC services, verify /health (Aggregate Insight Publication and the Demand-Planning Loop)."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.k8s.amisad.baseline
requiresSnapshot:
  id: "k8s.amisad"
variables:
  username: yamisad

steps:
  - action: loadDiskSnapshot
    id: "k8s.amisad"
    description: "Restore the AmisAd k8s + PostgreSQL + NATS baseline checkpoint"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.sh"
    description: "Deploy AmisAd POC skeletons (build images, helm install all services)"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3600

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.scenario-009.sh"
    description: "SCENARIO-009 skeleton checks: /health of traversed services"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 900

  - action: saveSystemDiagnostic
    id: "amisad.scenario-009"
    description: "Capture diagnostics after SCENARIO-009 checks"