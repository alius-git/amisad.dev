# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - vm-edge-b (region B slice VM): identical preparation to
# vm-edge-a under its own hostname/admin. Built per the design topology now;
# first exercised by s004.failover (jurisdiction choice) and s009.suppression
# (anonymity threshold), so the test driver leaves it stopped until then.

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 4277aa07-3c5d-4e69-9f2b-0d4c6e81f377
sequenceRevision: 1

description: "Ubuntu Server: provision amisad-vm-edge-b (admin amisad-vm-edge-b-admin), install the demo key + IP reporter over SSH, snapshot amisad-vm-edge-b."
baseline:
  ubuntu.server.24:
    - start.guest.ubuntu.server.24
variables:
  username: amisad-vm-edge-b-admin
  hostname: amisad-vm-edge-b

steps:
  - action: sshWaitReady
    timeoutSeconds: 300
    description: "SSH up after the start.guest reboot"

  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-vm-edge.setup.sh"
    timeoutSeconds: 600
    description: "Edge setup: demo key into authorized_keys + boot-time IP reporter"

  - action: saveDiskSnapshot
    id: "amisad-vm-edge-b"
    description: "Snapshot the region-B slice VM"
