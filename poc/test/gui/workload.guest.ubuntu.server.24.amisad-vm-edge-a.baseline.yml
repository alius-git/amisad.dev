# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - vm-edge-a (region A slice VM): a fresh Ubuntu Server (hostname
# amisad-edge-a, admin amisad-edge-a-admin) prepared for the stateless
# slice runtime: the core->edge demo public key in the admin's authorized_keys
# and a boot-time IP reporter (posts <hostname>.ip.txt to the host status
# server) so amisad-core can locate this edge. Snapshotted as
# "amisad-edge-a"; slice-runtime itself is delivered per scenario run.

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 4266ff06-2b4c-4d58-8e1a-9c3b5d70e266
sequenceRevision: 1

description: "Ubuntu Server: provision amisad-edge-a (admin amisad-edge-a-admin), install the demo key + IP reporter over SSH, snapshot amisad-edge-a."
baseline:
  ubuntu.server.24:
    - start.guest.ubuntu.server.24
variables:
  username: amisad-edge-a-admin
  hostname: amisad-edge-a

steps:
  - action: sshWaitReady
    timeoutSeconds: 300
    description: "SSH up after the start.guest reboot"

  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-edge.setup.sh"
    timeoutSeconds: 600
    description: "Edge setup: demo key into authorized_keys + boot-time IP reporter"

  - action: saveDiskSnapshot
    id: "amisad-edge-a"
    description: "Snapshot the region-A slice VM"
