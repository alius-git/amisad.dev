# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - baseline: Ubuntu Server + Kubernetes + PostgreSQL + NATS,
# snapshotted as "k8s.amisad" for the ten scenario sequences to warm-path from.
# Mirrors the yuruna-project text-to-sql baseline chain.

# Perf-log identity. Bump revision on step add/remove.
# Rev 2: framework postgresql.sh replaced by a self-sufficient db.sh
# (the framework script's cluster re-init raced nondeterministically -
# "cluster configuration already exists", cycle 248).
sequenceGuid: 42098986-ed31-41e5-ac09-1e50119cc209
sequenceRevision: 2

description: "Ubuntu Server: log in, install Kubernetes + PostgreSQL + NATS, snapshot k8s.amisad."
baseline:
  ubuntu.server.24:
    - start.guest.ubuntu.server.24
variables:
  username: yamisad

steps:
  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@${vmName}"
    timeoutSeconds: 90
    description: "OCR: ${username}@${vmName}"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh guest/ubuntu.server.24/ubuntu.server.24.k8s.sh"
    description: "ubuntu.server.24.k8s.sh (install Kubernetes)"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 1800

  - action: inputTextAndEnter
    text: "kubectl wait --for=condition=Ready nodes --all --timeout=300s; clear; kubectl get nodes"
    description: "Check node status"

  - action: waitForText
    pattern: "Ready"
    timeoutSeconds: 90
    description: "OCR: Ready"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.db.sh"
    description: "AmisAd database bring-up (install PostgreSQL, create amisad DB, load schema.sql)"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 900

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.nats.sh"
    description: "Deploy NATS JetStream into the cluster"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 600

  - action: saveDiskSnapshot
    id: "k8s.amisad"
    description: "Snapshot the AmisAd infrastructure baseline"