# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s009.suppression: Aggregate Insight Publication and the Demand-Planning Loop
# Skeleton sequence: restores the amisad.k8s snapshot, deploys the service
# skeletons, and verifies /health for the services this scenario traverses.
# See plan/scenarios.md for the full scenario and its Target Verification Point.
# TODO(s009.suppression): implement the real steps per plan/scenarios.md.

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 42abb59b-828b-47cc-bee1-4300127d9e50
sequenceRevision: 1

description: "AmisAd s009.suppression skeleton: deploy POC services, verify /health (Aggregate Insight Publication and the Demand-Planning Loop)."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.k8s.amisad.baseline
requiresSnapshot:
  id: "amisad.k8s"
variables:
  username: yamisad-s009

steps:
  - action: loadDiskSnapshot
    id: "amisad.k8s"
    description: "Restore the AmisAd k8s + PostgreSQL + NATS baseline checkpoint"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.sh"
    description: "Deploy AmisAd POC skeletons (build images, helm install all services)"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3600

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.s009.suppression.sh"
    description: "s009.suppression skeleton checks: /health of traversed services"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 900

  - action: saveSystemDiagnostic
    id: "amisad.s009.suppression"
    description: "Capture diagnostics after s009.suppression checks"