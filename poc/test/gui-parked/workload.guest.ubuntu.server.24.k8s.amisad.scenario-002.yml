# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - SCENARIO-002: Considered Purchase, Constraint Fidelity, and In-Person Booking
# Skeleton sequence: restores the k8s.amisad snapshot, deploys the service
# skeletons, and verifies /health for the services this scenario traverses.
# See plan/scenarios.md for the full scenario and its Target Verification Point.
# TODO(SCENARIO-002): implement the real steps per plan/scenarios.md.

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 42e7fc59-4aa9-4332-ae8e-82a20bdb30d0
sequenceRevision: 1

description: "AmisAd SCENARIO-002 skeleton: deploy POC services, verify /health (Considered Purchase, Constraint Fidelity, and In-Person Booking)."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.k8s.amisad.baseline
requiresSnapshot:
  id: "k8s.amisad"
variables:
  username: yamisad

steps:
  - action: loadDiskSnapshot
    id: "k8s.amisad"
    description: "Restore the AmisAd k8s + PostgreSQL + NATS baseline checkpoint"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.sh"
    description: "Deploy AmisAd POC skeletons (build images, helm install all services)"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3600

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.scenario-002.sh"
    description: "SCENARIO-002 skeleton checks: /health of traversed services"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 900

  - action: saveSystemDiagnostic
    id: "amisad.scenario-002"
    description: "Capture diagnostics after SCENARIO-002 checks"