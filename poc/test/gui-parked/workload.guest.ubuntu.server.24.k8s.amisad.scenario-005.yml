# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - SCENARIO-005: Campaign-Boosted Match, Edge Creative Serving, and Attribution Credit
# Skeleton sequence: restores the k8s.amisad snapshot, deploys the service
# skeletons, and verifies /health for the services this scenario traverses.
# See plan/scenarios.md for the full scenario and its Target Verification Point.
#
# TODO(SCENARIO-005) real steps to implement:
#   - Marcel creates a campaign from the aggregate demand view
#   - Brief to Kai; asset approved and placed
#   - Buyer need in campaign region; creative renders inside the environment
#   - Acceptance closes the match; attribution computed in the fabric
#   - Agency and creator credit on the ledger; budget decrements by outcome
#   - Assert: non-zero ad-partner credit, zero buyer signal campaign-side

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 42566d8a-628d-47e3-b8ce-abf76390b1e3
sequenceRevision: 1

description: "AmisAd SCENARIO-005 skeleton: deploy POC services, verify /health (Campaign-Boosted Match, Edge Creative Serving, and Attribution Credit)."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.k8s.amisad.baseline
requiresSnapshot:
  id: "k8s.amisad"
variables:
  username: yamisad

steps:
  - action: loadDiskSnapshot
    id: "k8s.amisad"
    description: "Restore the AmisAd k8s + PostgreSQL + NATS baseline checkpoint"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.sh"
    description: "Deploy AmisAd POC skeletons (build images, helm install all services)"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3600

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.scenario-005.sh"
    description: "SCENARIO-005 skeleton checks: /health of traversed services"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 900

  - action: saveSystemDiagnostic
    id: "amisad.scenario-005"
    description: "Capture diagnostics after SCENARIO-005 checks"