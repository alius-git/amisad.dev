# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - SCENARIO-010: Independent Certification of the Full Evidence Trail
# Skeleton sequence: restores the k8s.amisad snapshot, deploys the service
# skeletons, and verifies /health for the services this scenario traverses.
# See plan/scenarios.md for the full scenario and its Target Verification Point.
#
# TODO(SCENARIO-010) real steps to implement:
#   - Ingrid starts a certification run over the 001-009 corpus
#   - Recompute attestation chains, including the aborted environment
#   - Verify residency and consent (participation, mandates, disclosures)
#   - Verify settlement conservation (splits sum, adjustments compensate)
#   - Inject a tampered record copy; detection localizes it exactly
#   - Findings delivered to platform; audit access log proves read-only
#   - Assert: zero unexplained violations across all four dimensions

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 429faede-b8b2-447e-97dd-882a44e9b8d4
sequenceRevision: 1

description: "AmisAd SCENARIO-010 skeleton: deploy POC services, verify /health (Independent Certification of the Full Evidence Trail)."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.k8s.amisad.baseline
requiresSnapshot:
  id: "k8s.amisad"
variables:
  username: yamisad

steps:
  - action: loadDiskSnapshot
    id: "k8s.amisad"
    description: "Restore the AmisAd k8s + PostgreSQL + NATS baseline checkpoint"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.sh"
    description: "Deploy AmisAd POC skeletons (build images, helm install all services)"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3600

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.scenario-010.sh"
    description: "SCENARIO-010 skeleton checks: /health of traversed services"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 900

  - action: saveSystemDiagnostic
    id: "amisad.scenario-010"
    description: "Capture diagnostics after SCENARIO-010 checks"