# yaml-language-server: $schema=../../../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - SCENARIO-008: Zero-Knowledge Dispute Mediation and Settlement Adjustment
# Skeleton sequence: restores the k8s.amisad snapshot, deploys the service
# skeletons, and verifies /health for the services this scenario traverses.
# See plan/scenarios.md for the full scenario and its Target Verification Point.
#
# TODO(SCENARIO-008) real steps to implement:
#   - Maya reports non-delivery on a settled order
#   - Sam mediates on metadata; buyer identity structurally absent
#   - Consented disclosure: request -> grant -> artifact -> expiry
#   - Refund posted as compensating entries referencing the case
#   - Recurring pattern escalates to Priya
#   - Assert: case identity-free end to end; post-expiry access fails

# Perf-log identity. Bump revision on step add/remove.
sequenceGuid: 42a95e9f-3748-47f8-b8ad-cc9564d81776
sequenceRevision: 1

description: "AmisAd SCENARIO-008 skeleton: deploy POC services, verify /health (Zero-Knowledge Dispute Mediation and Settlement Adjustment)."
baseline:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.k8s.amisad.baseline
requiresSnapshot:
  id: "k8s.amisad"
variables:
  username: yamisad

steps:
  - action: loadDiskSnapshot
    id: "k8s.amisad"
    description: "Restore the AmisAd k8s + PostgreSQL + NATS baseline checkpoint"

  - action: retry
    maxAttempts: 2
    description: "Login + retry"
    steps:
      - snippet: firstLoginPrime

      - action: passwdPrompt
        pattern: "login:"
        timeoutSeconds: 600
        text: "${username}"
        description: "OCR: login:"

      - action: passwdPrompt
        pattern: "Password:"
        text: "${ext:authentication.GetPassword(${username})}"
        description: "OCR: Password:"

  - action: waitForText
    pattern: "${username}@"
    timeoutSeconds: 90
    description: "OCR: shell prompt"

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.sh"
    description: "Deploy AmisAd POC skeletons (build images, helm install all services)"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 3600

  - action: fetchAndExecute
    text: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.workload.k8s.amisad.scenario-008.sh"
    description: "SCENARIO-008 skeleton checks: /health of traversed services"
    waitPattern: "FETCHED AND EXECUTED:"
    timeoutSeconds: 900

  - action: saveSystemDiagnostic
    id: "amisad.scenario-008"
    description: "Capture diagnostics after SCENARIO-008 checks"