# yaml-language-server: $schema=../../../yuruna/test/schemas/sequence.schema.yml
#
# AmisAd POC - s004.failover (Sovereign Slice Allocation, Isolation Fault,
# and Attested Failover): restore amisad-core, then over SSH start
# slice-runtime on BOTH edges (region-a and region-b, region identity
# attested).

sequenceGuid: 427078bc-c296-4ce8-8d7f-bfc58eaa246d
sequenceRevision: 3

description: "AmisAd s004.failover: restore amisad-core, sovereign placement over two live edges, injected isolation faults with attested aborts, automatic retry, one settlement, cross-party incident case."
keystrokeMechanism: ssh
resource:
  ubuntu.server.24:
    - workload.guest.ubuntu.server.24.amisad-core.deploy
requiresSnapshot:
  id: "amisad-core"
variables:
  username: amisad-core-admin
  hostname: amisad-core

# The retry covers putting amisad-core in position -- restore, SSH, a cluster
# whose pods and NodePort rules are the live ones -- and stops there. Those steps
# are idempotent and every attempt starts from the snapshot again. The workload
# below is deliberately outside it: a scenario that passes only on a second run
# is reporting a defect, and replaying it would file the report in the bin.
component:
  - action: retry
    description: "Put amisad-core in position for s004.failover: restore, SSH, cluster live"
    steps:
      - action: loadDiskSnapshot
        id: "amisad-core"
        description: "Restore the deployed AmisAd vm-core (per-scenario state reset)"

      - action: sshWaitReady
        timeoutSeconds: 300
        description: "SSH up after the restore"

      - action: sshFetchAndExecute
        command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.ready.sh"
        timeoutSeconds: 900
        description: "Bring the restored cluster to a known-live state (deployments restarted, every NodePort answering)"

workload:
  - action: sshFetchAndExecute
    command: "/usr/local/lib/yuruna/fetch-and-execute.sh project/poc/test/ubuntu.server.24/ubuntu.server.24.amisad-core.s004.failover.sh"
    timeoutSeconds: 1800
    description: "Run s004.failover fault-injection flow (both edges), assert full TVP"

  - action: saveSystemDiagnostic
    id: "amisad.s004.failover"
    description: "Capture diagnostics after the s004.failover run"
