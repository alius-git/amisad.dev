[package]
name = "amisad-demo-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
amisad-common = { path = "../../lib/amisad-common" }
bytes = "1"
http-body-util = "0.1.5"
hyper = { version = "1.13", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
if-addrs = { version = "0.15", features = [] }
percent-encoding = "2.3"
serde_json = "1"
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
