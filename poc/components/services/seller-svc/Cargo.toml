[package]
name = "seller-svc"
version = "0.1.0"
edition = "2021"
# Lab toolchain pin (build VM + MODULE.bazel); keeps dependency resolution honest.
rust-version = "1.96"
description = "Seller catalog, inventory, order lifecycle, and settlement views (AmisAd POC skeleton)"

[dependencies]
amisad-common = { path = "../../lib/amisad-common" }
# PostgreSQL client for the durable ledger/catalog stores (DATABASE_URL-gated);
# resolved for Bazel through crate_universe from the committed Cargo.lock.
postgres = "0.19"
