[package]
name = "resource-svc"
version = "0.1.0"
edition = "2021"
# Lab toolchain pin (build VM + MODULE.bazel); keeps dependency resolution honest.
rust-version = "1.98"
description = "Carrier control plane: allocation policy, slice controller, telemetry, incidents (AmisAd POC skeleton)"

[dependencies]
amisad-common = { path = "../../lib/amisad-common" }
# PostgreSQL client for the durable jurisdiction policies (DATABASE_URL-gated);
# resolved for Bazel through crate_universe from the committed Cargo.lock.
postgres = "0.19"
