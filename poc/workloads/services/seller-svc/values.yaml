# GUID: 42d4d011-cb80-40fd-8bb1-2777ba8e5b09
namespace: amisad
image: localhost:5000/amisad/seller-svc:latest
port: 8080
replicas: 1
pullPolicy: IfNotPresent
# Set to a postgres:// URL to use the durable store; empty = in-memory.
databaseUrl: ""
# Secret holding the database role's password under key 'password', read into
# AMISAD_DB_PASSWORD so databaseUrl can reference $(AMISAD_DB_PASSWORD);
# empty = no password variable.
databasePasswordSecret: ""
# Secret holding the ledger write token under key 'token', read into
# LEDGER_WRITE_TOKEN; empty = no token variable.
ledgerWriteSecret: ""
