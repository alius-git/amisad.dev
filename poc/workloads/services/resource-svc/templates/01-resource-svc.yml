{{- if ne (toString .Values.replicas) "1" -}}
{{- fail "replicas must be exactly 1 for this cached single-writer service" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicas }}
  # Single-writer store: never let an old and a new pod overlap, or two
  # in-memory copies of the edge registry and the policies could diverge.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- if .Values.databaseUrl }}
            # NODE_IP resolves at pod start (snapshot restores can change the
            # node address); databaseUrl may reference it as $(NODE_IP).
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            {{- if .Values.databasePasswordSecret }}
            # The role password exists only in this Secret, which the deploy
            # step sets for each build. Kubernetes expands $(NAME) only from
            # variables defined earlier in this list, so DATABASE_URL comes last.
            - name: AMISAD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databasePasswordSecret | quote }}
                  key: password
            {{- end }}
            - name: DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Chart.Name }}
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
