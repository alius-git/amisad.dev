openapi: 3.0.3
info:
  title: seller-svc
  description: "Seller catalog with standing auto-close deals, fitting slots, and the order state machine (s001.fulfillment + s002.fitting surface). Order records structurally contain no buyer identity."
  version: 0.2.0
paths:
  /health:
    get:
      summary: "Liveness probe"
      responses:
        "200": { description: "Service is alive" }
  /version:
    get:
      summary: "Build version"
      responses:
        "200": { description: "Service name and version" }
  /v1/offers:
    post:
      summary: "Create an offer (body: offer_id, tenant, title, category, region, price_cents, deliver_by_days, auto_close; optional attributes[], fitting_slots[{slot_id, day, day_ordinal}])"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "Offer stored" }
        "400": { description: "Missing field" }
  /v1/offers/region/{region}:
    get:
      summary: "Offers available in a region"
      parameters:
        - { name: region, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "offers: [...]" }
  /v1/orders:
    post:
      summary: "Create a committed order from a match or booking (body: match_id, offer_id, tenant, need_context; optional slot_id, slot_day for an in-person appointment)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "Order committed" }
        "409": { description: "Order exists" }
    get:
      summary: "The order board: every order, appointments included (also how the harness asserts zero pre-booking commitments)"
      responses:
        "200": { description: "count, orders: [...]" }
  /v1/orders/advance:
    post:
      summary: "Advance an order (committed->provisioning->fulfilled); fulfilled confirms settlement and lands settled (body: match_id, state)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "New state" }
        "404": { description: "No order" }
        "409": { description: "Illegal transition" }
  /v1/orders/match/{matchId}:
    get:
      summary: "Order by match id (need context only; no buyer identity field exists)"
      parameters:
        - { name: matchId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "match_id, offer_id, tenant, need_context, state; appointment {slot_id, day} when booked" }
        "404": { description: "No order" }
  /v1/offers/inventory:
    post:
      summary: "Set an offer's stock; 0 removes it from the matchable catalog (s007; body: offer_id, stock)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "offer_id, stock" }
        "404": { description: "unknown offer_id" }
