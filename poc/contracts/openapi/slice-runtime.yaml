openapi: 3.0.3
info:
  title: slice-runtime
  description: "Sealed match environment on the edge: one full attested lifecycle per request (region identity attested), with a complete egress log and harness fault injection (s001.fulfillment + s002.fitting + s004.failover surface). Started with ADVERTISE_URL, REGION and RESOURCE_URL, the runtime registers itself with resource-svc (POST /v1/edges with CAPACITY or 1) under a 30-second lease renewed every 10 seconds. Its attestation and settlement-instruction appends to ledger-svc carry LEDGER_WRITE_TOKEN as a bearer when it is set; telemetry carries none."
  version: 0.2.0
paths:
  /health:
    get:
      summary: "Liveness probe"
      responses:
        "200": { description: "Service is alive" }
  /version:
    get:
      summary: "Build version"
      responses:
        "200": { description: "Service name and version" }
  /v1/environments:
    post:
      summary: "Run one environment lifecycle: created->attested->executed->destroyed (body: jurisdiction, envelope, offers, policy?). Opens the envelope and matches against every stated constraint (category/price/region/deadline, required attributes, exclusions, fitting availability). Auto-close needs: emits the settlement instruction and returns the committed match record. Manual-policy needs: returns the shortlist of every fully-fitting offer and commits nothing. policy 'manual' takes the shortlist path whatever the envelope's closing policy says; it can only narrow it."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "Match record (match_id, environment_id, offer, need_context) or shortlist (environment_id, shortlist, need_context) for manual policy" }
        "400": { description: "Bad envelope (aborted + destroyed attested), or a policy other than 'manual' (invalid_request; refused before an environment exists, nothing attested)" }
        "404": { description: "No fitting offer for an auto-close need (executed + destroyed attested)" }
        "503": { description: "Armed isolation fault: aborted BEFORE the envelope is opened (aborted + destroyed attested with fault reason); body: status, environment_id, fault" }
  /v1/faults:
    post:
      summary: "Harness-only: arm the next N environments to abort with an isolation fault (body: mode='isolation', count 0..=16)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "armed: N" }
  /v1/egress:
    get:
      summary: "Everything that ever left an environment on this runtime - the zero-leak assertion surface"
      responses:
        "200": { description: "entries: [string]" }
