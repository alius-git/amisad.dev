openapi: 3.0.3
info:
  title: platform-svc
  description: "Marketplace stewardship: cross-party incident cases (s004.failover surface); registry and settlement oversight land with later scenarios"
  version: 0.1.0
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
  /version:
    get:
      summary: Build version
      operationId: getVersion
      responses:
        "200":
          description: Service name and version
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  version: { type: string }
  /v1/incidents:
    post:
      summary: "Open a cross-party incident case linking environment lifecycles (body: summary, from, environment_ids[])"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "case_id" }
        "400": { description: "Missing/invalid fields (environment_ids must be a non-empty array of strings)" }
    get:
      summary: "List incident cases"
      responses:
        "200": { description: "cases: [...]" }
  /v1/incidents/{case_id}:
    get:
      summary: "One incident case with its linked environment ids"
      parameters:
        - { name: case_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The case" }
        "404": { description: "Unknown case" }
