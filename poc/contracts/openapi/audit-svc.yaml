openapi: 3.0.3
info:
  title: audit-svc
  description: "Independent certification of the full evidence trail across four dimensions, tamper localization, and a read-only access log (s010.certification)"
  version: 0.1.0
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
  /version:
    get:
      summary: Build version
      operationId: getVersion
      responses:
        "200":
          description: Service name and version
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  version: { type: string }
  /v1/certify:
    post:
      summary: "s010: independently certify attestation, residency, consent, and settlement over the ledger chains"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "per-dimension findings, certified" }
  /v1/certify/tamper:
    post:
      summary: "Detect and localize a tampered attestation record (body: entries[])"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "detected, tampered_index" }
  /v1/access-log:
    get:
      summary: "The auditor's own access log (all GET: read-only, no personal-data scope)"
      responses:
        "200": { description: "access[]" }
