openapi: 3.0.3
info:
  title: fabric-coordinator
  description: "Routes opaque need envelopes to sealed slice environments; never parses the envelope. Consent-gated execution, open needs, matching cycles, and automatic abort retry (s001-s004 surface). Every error is a catalog problem: code (stable, for clients to branch on), error (localized by Accept-Language), detail when present (an untranslated diagnostic, such as the upstream answer), and correlation_id (the X-Request-Id this response carries). Consent and mandate refusals keep status and reason."
  version: 0.2.0
paths:
  /health:
    get:
      summary: "Liveness probe"
      responses:
        "200": { description: "Service is alive" }
  /version:
    get:
      summary: "Build version"
      responses:
        "200": { description: "Service name and version" }
  /v1/needs:
    post:
      summary: "Submit a need (body: token, jurisdiction, envelope). The envelope is an opaque string opened only inside the sealed environment. Auto-close needs return a committed match; manual-policy needs return a shortlist and commit nothing."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "Match (handle, match_id, environment_id, offer), shortlist (handle, environment_id, shortlist) for manual policy, or open (handle, status='open') when nothing fits yet" }
        "403": { description: "Participation consent revoked - no environment is created" }
        "401": { description: "Unverified actor (unverified_actor)" }
        "404": { description: "No fitting offer" }
        "503": { description: "No compliant edge (no_compliant_edge) or a dependency unavailable (upstream_unavailable, upstream_failed)" }
  /v1/bookings:
    post:
      summary: "Book a shortlist offer's fitting slot (body: handle, offer_id, slot_id). This is the commitment for a manual-policy need: posts the settlement instruction and creates the seller order with the appointment - need context only, no buyer identity."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "Booking (handle, match_id, offer_id, slot_id, slot_day, state committed); delivers the booking-confirmed notification" }
        "400": { description: "Missing handle/offer_id/slot_id" }
        "404": { description: "Unknown handle / offer not on shortlist / slot not offered (unknown_handle, offer_not_on_shortlist, slot_not_offered)" }
        "200": { description: "Identical completed booking replay; no duplicate notification or attribution" }
        "409": { description: "Handle already booked with a different offer or slot (already_booked)" }
        "502": { description: "Ledger or seller rejected the commitment; an identical retry resumes matching durable writes" }
        "503": { description: "Ledger unavailable" }
  /v1/notifications/{handle}:
    get:
      summary: "Per-handle notification log, in delivery order (the buyer's only notification surface; s002.fitting asserts its exact length)"
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "notifications: [{kind}]" }
  /v1/orders/{handle}:
    get:
      summary: "Pseudonymous order status for the buyer (in-progress | delivered)"
      parameters:
        - { name: handle, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "handle, status" }
        "404": { description: "Unknown handle (unknown_handle)" }
  /v1/consents:
    post:
      summary: "Record a consent action for the verified subject and, on a participation grant, re-serve open needs (body: token, grant_type participation|contribution, action grant|revoke)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "subject, grant_type, action, ts, hash, rematched" }
  /v1/consents/state:
    post:
      summary: "Current consent state + immutable history for the verified subject (body: token)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "subject, participation, contribution, history" }
  /v1/offers/published:
    post:
      summary: "Offer-published event (from seller-svc): run a consent-gated matching cycle over the open needs"
      responses:
        "200": { description: "rematched: N" }
  /v1/needs/contributions:
    get:
      summary: "Count of open needs whose subject grants aggregate contribution (counts only; no identity, no content)"
      responses:
        "200": { description: "contributions: N" }
  /v1/mandates:
    post:
      summary: "Principal grants a delegate a scoped mandate; recorded on the consent ledger (s006; body: token, delegate, category, per_item_cents)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "principal, delegate, scope, hash" }
  /v1/mandates/revoke:
    post:
      summary: "Revoke a mandate (body: token, delegate)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "revoked, hash" }
  /v1/mandates/approve:
    post:
      summary: "Principal approves a held over-cap match (body: token, handle). The match stays held until its commit succeeds."
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "committed via approval; the match leaves the held list" }
        "404": { description: "no held match for this principal and handle (held_match_not_found): never held, already committed, or revoked" }
        "502": { description: "The commit failed (upstream_failed, upstream_unavailable); the match stays held, and a retry records another mandate use and resumes the instruction and order, whose identical replays answer 200" }
        "503": { description: "A dependency was unavailable (upstream_unavailable); the match stays held for a retry, as for 502" }
  /v1/delegate/workspace:
    post:
      summary: "The delegate's principals + scope (empty after revocation; body: token)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "principals: [...]" }
  /v1/delegate/needs:
    post:
      summary: "A delegated need: scope-checked, then dispatched with policy manual whatever the sealed envelope says, so the environment returns a shortlist and the coordinator decides: under-cap closes, over-cap held (body: token, principal, category, jurisdiction, envelope)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "committed | held-for-approval | no-match" }
        "403": { description: "no valid mandate | out of scope" }
        "502": { description: "The environment closed a match despite the manual dispatch (manual_dispatch_ignored); nothing is recorded or ordered for it" }
  /v1/activity:
    post:
      summary: "The principal's activity trail (dual attribution; body: token)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "activity: [...]" }
  # s005: GET /v1/campaigns/region/{region} is served by ads-svc; the coordinator fetches it and
  # passes campaigns into the sealed environment. A boosted /v1/bookings settles agency+creator credit.
  /v1/disclosures:
    post:
      summary: "s008: the principal grants a scoped, time-boxed disclosure for a support case; recorded on the consent ledger, artifact delivered to the platform (body: token, case_id, artifact, ttl_secs)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "case_id, scope, expiry_ts, hash" }
