openapi: 3.0.3
info:
  title: insights-svc
  description: "Threshold-protected aggregate demand insights: consent-gated aggregation cycles (s003.silence); anonymity-threshold suppression, versioned outlooks, workbench, and unmet-demand flags (s009.suppression)"
  version: 0.1.0
paths:
  /health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
  /version:
    get:
      summary: Build version
      operationId: getVersion
      responses:
        "200":
          description: Service name and version
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string }
                  version: { type: string }
  /v1/aggregation/cycle:
    post:
      summary: "Run one aggregation cycle: pull the consent-contributing open-need COUNT from the fabric (s003.silence minimal slice)"
      responses:
        "201": { description: "cycle, contributions" }
  /v1/aggregates:
    get:
      summary: "Aggregation cycle history (counts only; no identity, no content)"
      responses:
        "200": { description: "cycles, latest_contributions, history" }
  /v1/insights/record:
    post:
      summary: "s009: record a unit of demand/supply per cell (body: category, region, kind need|offer)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: "recorded" }
  /v1/workbench:
    get:
      summary: "Above-threshold aggregates only; below-threshold cells are suppressed (absent)"
      responses:
        "200": { description: "threshold, aggregates" }
  /v1/outlooks:
    post:
      summary: "Publish a versioned, immutable outlook from the above-threshold aggregates (body: version)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "201": { description: "the outlook" }
        "409": { description: "version exists" }
  /v1/outlooks/{version}:
    get:
      summary: "A published outlook by version (seller and ads views read this)"
      parameters:
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "the outlook" }
        "404": { description: "no such version" }
  /v1/unmet-demand:
    get:
      summary: "Above-threshold cells where needs outnumber offers, flagged by category+region only"
      responses:
        "200": { description: "unmet flags" }
